<!doctype html>
<html class="ncase" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap">

    <!-- the site's own stylesheet first, so the nav and base match every other page -->
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/neuralyzer.css' | relative_url }}">
    {% seo %}
  </head>
  <body>
    <canvas id="canvas"></canvas>

    {% include navigation.html %}

    <div class="n-progress"><div class="n-progress-bar"></div></div>

    <div class="n-scroll" id="n-scroll">
      {{ content }}
    </div>

    <!-- the site starfield, unmodified -->
    <script src="{{ '/assets/js/canvas.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/neuralyzer.js' | relative_url }}"></script>
  </body>
</html>
