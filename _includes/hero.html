<section class="hero">
  <div class="hero-text">
    <div class="eyebrow">{% for e in site.author.eyebrow %}<span>{{ e }}</span>{% endfor %}</div>
    <h1 class="display display--xl">{{ site.author.name }}</h1>
    <p class="lede">{{ site.author.summary }}</p>
    <div class="hero-actions">
      {%- if site.author.cv != "" %}
      <a class="ckey ckey--primary" href="{{ site.author.cv }}">{% include icon.html name="download" %}<span>Download CV</span></a>
      {%- endif %}
      {% include social-keys.html %}
    </div>
  </div>
  {% include porthole.html %}
</section>
