{%- comment -%} Your photo in a round porthole, or your initials until `author.portrait` is set in _config.yml. {%- endcomment -%}
<div class="porthole{% if include.small %} porthole--small{% endif %}">
  <svg class="porthole-orbit" aria-hidden="true" viewBox="0 0 320 320"><ellipse cx="160" cy="160" rx="156" ry="58" transform="rotate(-24 160 160)"/><circle cx="20" cy="210" r="5"/></svg>
  <div class="porthole-glass">
    {%- if site.author.portrait and site.author.portrait != "" %}
    <img src="{{ site.author.portrait | relative_url }}" alt="Portrait of {{ site.author.name }}">
    {%- else %}
    <span class="porthole-initials" aria-hidden="true">{{ site.author.initials }}</span>
    {%- endif %}
  </div>
</div>
