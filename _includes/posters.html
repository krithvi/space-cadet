{%- if site.data.posters.size > 0 %}
<section class="sec">
  {% include section-head.html num=include.num title="Posters" %}
  <div class="posters">
    {%- for p in site.data.posters %}
    <figure class="poster-tile">
      {%- if p.image %}
      {% include poster.html src=p.image alt=p.title ratio=p.ratio %}
      {%- else %}
      <div class="poster poster--empty" style="--ratio: {{ p.ratio | default: 1.414 }}">{% include patch.html px=96 %}<span>Preview on request</span></div>
      {%- endif %}
      <figcaption>
        <span class="label">{{ p.when }} · {{ p.venue }}</span>
        <span class="poster-title">{{ p.title }}</span>
        <a class="poster-ask" href="mailto:{{ site.author.email }}?subject={{ 'Poster: ' | append: p.title | uri_escape }}">Ask for the full poster</a>
      </figcaption>
    </figure>
    {%- endfor %}
  </div>
</section>
{%- endif %}
