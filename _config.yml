theme: jekyll-theme-hacker
markdown: kramdown
kramdown:
  input: GFM

# GitHub Pages serves this repo at https://krithvi.github.io/space-cadet/
# baseurl is that subpath; every asset and link must go through `| relative_url` so it resolves both locally and on Pages.
# The Actions workflow passes --baseurl, which overrides this value; it's here so `jekyll serve` locally matches production.
baseurl: ""
url: "https://krithvi.space/"

# Never copy these into the built site.
exclude:
  - _site
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitsecret
  - README.md

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Each collection is a folder of Markdown files (_research/, _design/).
# Jekyll builds one page per file and exposes them as site.research / site.design.
collections:
  research:
    output: true
    permalink: /research/:name/
  design:
    output: true
    permalink: /design/:name/

# Every file in these folders gets the entry layout unless it says otherwise.
defaults:
  - scope: { path: "", type: research }
    values: { layout: entry, section: Research, section_url: /research.html }
  - scope: { path: "", type: design }
    values: { layout: entry, section: Design Lab, section_url: /design.html }