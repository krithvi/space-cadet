markdown: kramdown
kramdown:
  input: GFM

# Served at the root of the custom domain, so baseurl stays empty.
# Every asset and link still goes through `| relative_url`, so a future move to a subpath only means changing baseurl.
baseurl: ""
url: "https://krithvi.space"

# Never copy these into the built site.
exclude:
  - _site
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitsecret
  - README.md
  - tools
  - posters-src

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Each collection is a folder of Markdown files (_research/, _design/).
# Jekyll builds one page per file and exposes them as site.research / site.design.
collections:
  research:
    output: true
    permalink: /research/:name/
  design:
    output: true
    permalink: /design/:name/

# Every file in these folders gets the entry layout unless it says otherwise.
defaults:
  - scope: { path: "", type: research }
    values: { layout: entry, section: Research, section_url: /research.html }
  - scope: { path: "", type: design }
    values: { layout: entry, section: Design, section_url: /design.html }

# ── You ─────────────────────────────────────────────────────────────
# Everything on Base and About that's about you lives here.
# Leave a link empty ("") to hide its button.
title: Kavya Rajendran
description: "Kavya Rajendran is a PhD student in Human-Centered Computing at UMBC, exploring affective computing and emotional well-being."
author:
  name: Kavya Rajendran
  initials: KR                     # shown in the porthole until a photo is set
  portrait: /assets/img/kavya-portrait.png # (square, at least 600×600)
  eyebrow: [PhD · Human-Centered Computing, UMBC, 2025 – 2029]
  summary: "I will be exploring the intersection of affective computing and emotional well-being through the lenses of collaborative reflection and dance therapy."
  location: Catonsville, MD
  email: kvyrjndrn@gmail.com
  cv: https://krithvi.github.io/krithvi/CV.pdf
  scholar: https://scholar.google.com/citations?user=w7iv7qgAAAAJ&hl=en
  linkedin: linkedin.com/in/kavya-rajendran
  orcid: ""
  github: https://github.com/krithvi
  favicon: ""                      # later: e.g. /assets/img/favicon.png (square, 512×512)